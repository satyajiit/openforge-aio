[package]
name         = "openforge-host-common"
version      = { workspace = true }
edition      = { workspace = true }
rust-version = { workspace = true }
license      = { workspace = true }
authors      = { workspace = true }
repository   = { workspace = true }
description  = "Shared host-side engine plumbing: DLL injection (LoadLibrary remote-thread) and named-pipe transport (length-prefixed postcard framing). Engine-agnostic; per-engine protocol + session semantics live in the engine's own *-host crate."

[dependencies]
serde     = { workspace = true }
postcard  = { workspace = true }
thiserror = { workspace = true }
tracing   = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_Security",
] }
