[meta]
feature      = "game_speed"
display_name = "Game Speed"
tagline      = "Slow-mo or fast-forward the whole game."
description  = """
Scales the global gameplay clock by writing the `ZGameTimeManager` singleton's \
`m_fGameTimeMultiplier` (f32 @ +0x68): 1.0 = normal, <1 = slow-mo, >1 = \
fast-forward. Pure Denuvo-safe data write — no `.text` patch. The singleton is \
a module static, so it is re-found each session by a structural [heap_scan] \
fingerprint on its vtable rather than a hardcoded address. The multiplier is \
not re-stamped by the engine, so a one-shot write holds; pick a preset or type \
a value and Apply. NOTE (per-build): the vtable `value` below is a module \
address — stable across launches of this build (no ASLR) but it shifts on a \
game update; re-derive it via RTTI (`.?AVZGameTimeManager@@`) if the feature \
stops resolving after a patch.
"""
tier = "world"
kind = "trainer"

[control]
kind = "input"
step = 0.05
presets = [
    { label = "0.25x Slow-mo", value = 0.25 },
    { label = "0.5x", value = 0.5 },
    { label = "1x Normal", value = 1.0 },
    { label = "2x Fast", value = 2.0 },
    { label = "4x", value = 4.0 },
]

[value]
type    = "f32"
min     = 0.05
max     = 10.0
display = "decimal"

[write]
strategy = "one_shot"

# -- Structural re-find of the ZGameTimeManager singleton --------------------
#
# Needle: the primary vtable VA (0x142C7E408), which sits at singleton+0x00 and
# is UNIQUE in the whole address space (a live scan returns exactly one hit —
# the module-static singleton). `field_offset` walks +0x68 forward so the
# resolved address is the multiplier itself (the write target).
[heap_scan]
value_type   = "u64"
value        = 0x142C7E408   # ZGameTimeManager primary vtable (singleton+0x00)
field_offset = 104           # +0x68: resolved address := m_fGameTimeMultiplier
alignment    = 8

# singleton+0x08 = secondary vtable (0x142C7E438) — a module pointer. Validate
# it lies in the main module image [0x140000000, 0x156B1E000) so a stray stack
# copy of the primary vtable (which has no module pointer at +0x08) is rejected.
[[heap_scan.validators]]
field_type      = "u64"
relative_offset = -96        # -0x60 from the multiplier == singleton+0x08
min             = 5368709120.0   # 0x1_4000_0000  (module base)
max             = 5816504320.0   # 0x1_56B1_E000  (module base + size)

# The multiplier itself — at rest it is ~1.0; band only rejects a wild resolve.
[[heap_scan.validators]]
field_type      = "f32"
relative_offset = 0          # +0x00 == m_fGameTimeMultiplier
min             = 0.0
max             = 1000.0
