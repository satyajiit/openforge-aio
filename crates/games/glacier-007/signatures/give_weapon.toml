[meta]
feature      = "give_weapon"
display_name = "Give Weapon"
tagline      = "Grant any weapon lying nearby straight into your loadout."
description  = """
Lists every firearm currently present in the level by readable name and grants \
the one you pick. The grant fires that firearm's own pickup node (`firearm-0x3B8`) \
through the `ZCLTriggerPlayerItemPickup` handler on the game thread — the same \
path a real pickup takes — so it is Denuvo-safe (no code patch, no .text write). \
Because it reuses a present firearm's pickup node, the dropdown only lists \
weapons that are actually in the world right now (dropped by enemies, or on \
weapon racks); move near a dropped weapon and hit Refresh if the list is empty. \
A weapon only takes while you are in active gameplay (the grant needs a live \
game-thread rendezvous). Grant-any-from-the-global-library and ammo are a \
separate, larger effort (see GOAL 3).
"""
icon       = "crosshair"
icon_color = "oklch(72% 0.17 35)"
tier       = "inventory"
kind       = "mod"

[control]
kind        = "dropdown"
dynamic     = true                       # options come from `feature_options` (live firearm list)
placeholder = "Pick a nearby weapon…"
button_label = "Give Weapon"

[write]
strategy       = "engine_action"
action         = "glacier.give_weapon"   # invoke_feature_action(choice = model code)
options_action = "glacier.list_firearms" # feature_options -> present firearms by name
