[package]
name         = "openforge-batman-lod-dll"
version      = { workspace = true }
edition      = { workspace = true }
rust-version = { workspace = true }
license      = { workspace = true }
authors      = { workspace = true }
repository   = { workspace = true }
description  = "DLL injected into LEGO Batman: Legacy of the Dark Knight. Exposes UE5 reflection (FName / GUObjectArray / FProperty walk) over a named pipe to the trainer host."

[lib]
name       = "batman_lod_dll"
crate-type = ["cdylib"]

[dependencies]
openforge-ue5-protocol = { workspace = true }
openforge-ue5-lua      = { workspace = true }
serde                  = { workspace = true }
postcard               = { workspace = true }
parking_lot            = "0.12"
iced-x86               = { version = "1.21", default-features = false, features = ["std", "decoder", "fast_fmt"] }
memchr                 = "2"
retour                 = "0.3"

[build-dependencies]
cc = "1"

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemServices",
    "Win32_System_Memory",
    "Win32_System_ProcessStatus",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_Security",
] }
