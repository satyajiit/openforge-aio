[package]
name        = "openforge-glacier-host"
description = "Glacier 2 reflection engine (shared by the in-process DLL and external RPM) + the trainer-side injector/named-pipe session driver (behind the `client` feature)."
publish     = false
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
repository.workspace   = true

[lib]
name = "openforge_glacier_host"
path = "src/lib.rs"

[dependencies]
openforge-core             = { workspace = true }
openforge-engine           = { workspace = true, optional = true }
openforge-runtime          = { workspace = true, optional = true }
openforge-glacier-protocol = { workspace = true, optional = true }
parking_lot                = { version = "0.12", optional = true }
tracing                    = { workspace = true, optional = true }
postcard                   = { workspace = true, optional = true }
thiserror                  = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, optional = true, features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_Security",
] }

[features]
# The trainer-side driver: inject the per-game Glacier DLL and drive its
# named-pipe protocol via a `Ctx`-implementing `GlacierSession`. Off by
# default so the in-process DLL, which depends on this crate only for the
# reflection engine, never compiles the Win32 injection machinery.
client = [
    "dep:openforge-engine",
    "dep:openforge-runtime",
    "dep:openforge-glacier-protocol",
    "dep:parking_lot",
    "dep:tracing",
    "dep:windows",
    "dep:postcard",
    "dep:thiserror",
]
