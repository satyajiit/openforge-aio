[package]
name        = "openforge-app"
description = "OpenForge desktop app (Tauri 2 shell + Rust backend)"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
repository.workspace   = true

[[bin]]
name = "openforge"
path = "src/main.rs"

[lib]
name = "openforge_app_lib"
path = "src/lib.rs"

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
openforge-core         = { workspace = true }
openforge-runtime      = { workspace = true }
openforge-engine       = { workspace = true }
openforge-bundle       = { workspace = true }
openforge-ue5-host     = { workspace = true }
openforge-ue5-protocol = { workspace = true }
openforge-glacier-host     = { path = "../../glacier-host", features = ["client"] }
openforge-glacier-protocol = { path = "../../glacier-protocol" }
openforge-game-batman-lod = { path = "../../games/batman-lod" }

# Note: `devtools` feature deliberately NOT enabled in the default build so
# release binaries ship without the inspector. Devs who need to inspect can
# build with `--features devtools-enabled` (see [features] below).
tauri = { version = "2.11", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-shell  = "2"
tauri-plugin-global-shortcut = "2"

tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
parking_lot = "0.12"

serde            = { workspace = true }
serde_json       = { workspace = true }
anyhow           = { workspace = true }
thiserror        = { workspace = true }
tracing          = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = "0.2"
once_cell        = { workspace = true }
dirs             = "5"

# Lua script editor: parse-only validation (host side). The real
# in-game runtime lives in the per-game DLL (see crates/ue5-lua,
# Phase B). Vendored Lua avoids a system Lua dependency on Windows.
mlua = { version = "0.10", features = ["lua54", "vendored"] }

# Community script index fetcher (synchronous, runs under spawn_blocking).
# rustls-tls avoids the OpenSSL build on Windows.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_Security",
] }

[dev-dependencies]
tempfile = "3.10"

[features]
default = []
# Opt-in devtools for local debugging:
#   cargo run --features devtools-enabled
devtools-enabled = ["tauri/devtools"]
