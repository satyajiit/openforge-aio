[package]
name         = "openforge-ue5-host"
version      = { workspace = true }
edition      = { workspace = true }
rust-version = { workspace = true }
license      = { workspace = true }
authors      = { workspace = true }
repository   = { workspace = true }
description  = "Inject a game-specific OpenForge DLL into a target UE5 process and drive its named-pipe protocol. The DLL filename is supplied per-game by the caller."

[dependencies]
openforge-core         = { workspace = true }
openforge-engine       = { workspace = true }
openforge-runtime      = { workspace = true }
openforge-ue5-protocol = { workspace = true }
serde                  = { workspace = true }
postcard               = { workspace = true }
thiserror              = { workspace = true }
tracing                = { workspace = true }
tracing-subscriber     = { workspace = true, optional = true }
clap                   = { workspace = true, optional = true }
parking_lot            = "0.12"
once_cell              = { workspace = true }

[features]
# Compile the `ue5-host` CLI binary for dev iteration (inject/eject/diagnose).
cli = ["dep:clap", "dep:tracing-subscriber"]

[[bin]]
name = "openforge-ue5-host"
path = "src/bin/cli.rs"
required-features = ["cli"]

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_ProcessStatus",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_Security",
] }
