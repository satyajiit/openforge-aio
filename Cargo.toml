[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/runtime",
    "crates/engine",
    "crates/discover",
    "crates/cli",
    "crates/bundle",
    "crates/app/src-tauri",
    "crates/games/batman-lod",
    "crates/games/glacier-007",
    "crates/games/_template",
    "crates/ue5-protocol",
    "crates/ue5-lua",
    "crates/batman-lod-dll",
    "crates/ue5-host",
    "crates/glacier-host",
    "crates/glacier-protocol",
    "crates/glacier-007-dll",
]

[workspace.package]
version      = "0.1.0"
edition      = "2024"
rust-version = "1.95"
license      = "MIT"
authors      = ["OpenForge contributors"]
repository   = "https://github.com/GamesPatch/openforge"

[workspace.dependencies]
windows            = "0.61"
serde              = { version = "1", features = ["derive"] }
serde_json         = "1"
thiserror          = "2"
anyhow             = "1"
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
inventory          = "0.3"
toml               = "0.9"
ron                = "0.8"
clap               = { version = "4.5", features = ["derive"] }
once_cell          = "1"
rayon              = "1"
postcard           = { version = "1.1", default-features = false, features = ["alloc"] }

openforge-core         = { path = "crates/core" }
openforge-runtime      = { path = "crates/runtime" }
openforge-engine       = { path = "crates/engine" }
openforge-bundle       = { path = "crates/bundle" }
openforge-ue5-protocol = { path = "crates/ue5-protocol" }
openforge-ue5-lua      = { path = "crates/ue5-lua" }
openforge-ue5-host     = { path = "crates/ue5-host" }
openforge-glacier-host = { path = "crates/glacier-host" }
openforge-glacier-protocol = { path = "crates/glacier-protocol" }

[profile.release]
lto           = "thin"
codegen-units = 1
strip         = "symbols"
# `panic = "unwind"` is required by every per-game DLL crate (today:
# `openforge-batman-lod-dll`). Those DLLs are loaded into the game's address
# space and wrap every request handler in `catch_unwind`. With `abort`, a
# panic in any handler would terminate the game process — for an injected
# reflection server walking untrusted pointer chains, that's not acceptable.
# The unwind tables add a small size cost to every release binary; for a
# memory-IO-bound workload like ours that's a fair trade.
panic         = "unwind"

# Optimise dependencies even in debug builds. Our own crates stay at
# opt-level=0 (fast incremental rebuilds), but anything we depend on — the
# `windows-rs` shim, `serde`, `rayon`, `iced-x86`, the Tauri runtime — gets
# full release optimisation. The hot path inside the heap-scan is dominated
# by `ReadProcessMemory` + byte comparison, both of which live in
# dependencies, so this shaves the scan time from "a few seconds in debug"
# down to "release-fast" without losing dev ergonomics.
[profile.dev.package."*"]
opt-level = 3

# Convenience profile for the trainer: same optimisation as release, but
# keeps debug symbols + incremental compilation so a `cargo build` after a
# code change is still measured in seconds. Invoke via
#     pnpm tauri:dev:release
# from `crates/app/`.
[profile.dev-fast]
inherits      = "release"
debug         = true
incremental   = true
lto           = "off"     # thin LTO doesn't compose with incremental
codegen-units = 16        # fast parallel codegen for fast rebuilds
strip         = "none"
